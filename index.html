<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Metronome</title>
  <meta name="description" content="A practical metronome: type or scroll BPM, any time signature, accents, subdivisions, presets.">
  <meta name="theme-color" content="#121417">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Metronome">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('metronome.theme') || '"dark"');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <h1>Metronome</h1>
    <div class="topbar-actions">
      <button id="songsBtn" class="songs-btn" type="button">♫ Songs</button>
      <button id="theme" class="ghost" type="button" aria-label="Theme">Dark</button>
    </div>
  </header>

  <main>
    <!-- Tempo -->
    <section class="card tempo">
      <div class="tempo-name" id="tempoName">Allegro</div>
      <div class="bpm-row">
        <button class="round" id="bpmDown" type="button" aria-label="Decrease BPM">&minus;</button>
        <label class="bpm-display">
          <input id="bpm" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3"
                 autocomplete="off" aria-label="BPM, tap to type" value="120">
          <span class="bpm-unit" id="bpmUnit">BPM</span>
        </label>
        <button class="round" id="bpmUp" type="button" aria-label="Increase BPM">+</button>
      </div>
      <div class="wheel" id="wheel" tabindex="0" role="slider" aria-label="Fine-tune BPM"
           aria-valuemin="20" aria-valuemax="300" aria-valuenow="120"></div>
      <button class="wide" id="tap" type="button">Tap tempo</button>
    </section>

    <!-- Time signature -->
    <section class="card">
      <h2>Time signature</h2>
      <div class="timesig-row">
        <div class="fraction" aria-label="Time signature">
          <div class="stepper">
            <button class="round small" data-ts="beats" data-dir="-1" type="button" aria-label="Fewer beats">&minus;</button>
            <output id="tsBeats">4</output>
            <button class="round small" data-ts="beats" data-dir="1" type="button" aria-label="More beats">+</button>
          </div>
          <div class="fraction-line"></div>
          <div class="stepper">
            <button class="round small" data-ts="denom" data-dir="-1" type="button" aria-label="Longer beat note">&minus;</button>
            <output id="tsDenom">4</output>
            <button class="round small" data-ts="denom" data-dir="1" type="button" aria-label="Shorter beat note">+</button>
          </div>
        </div>
        <div class="chips ts-chips" id="tsChips"></div>
      </div>
      <div class="pulse-row" id="pulseRow" hidden>
        <span>BPM counts</span>
        <div class="chips" id="pulseChips"></div>
      </div>
      <p class="hint" id="tsHint"></p>
    </section>

    <!-- Beats / accents -->
    <section class="card">
      <div class="card-head">
        <h2>Beats</h2>
        <span class="bar-count" id="barCount"></span>
        <label class="switch">
          <input type="checkbox" id="stress" checked>
          <span class="track"></span>
          <span>Stress first beat</span>
        </label>
      </div>
      <div class="beats" id="beats"></div>
      <p class="hint">Tap a beat to cycle: accent &rarr; normal &rarr; mute</p>
    </section>

    <!-- Subdivision -->
    <section class="card">
      <h2>Subdivision</h2>
      <div class="chips" id="subChips"></div>
    </section>

    <!-- Sound -->
    <section class="card">
      <h2>Sound</h2>
      <div class="chips" id="kitChips"></div>
      <label class="volume">
        <span>Volume</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
      </label>
    </section>

    <!-- Presets -->
    <details class="card presets" id="presets">
      <summary><h2>Presets</h2><span class="count" id="presetCount"></span></summary>
      <form class="preset-save" id="presetForm">
        <input id="presetName" type="text" placeholder="Name, e.g. Song intro" maxlength="40" autocomplete="off" required>
        <button type="submit">Save</button>
      </form>
      <ul class="preset-list" id="presetList"></ul>
    </details>
  </main>

  <!-- Song mode: full-screen panel -->
  <div id="songView" class="song-view" role="dialog" aria-modal="true" aria-label="Songs" aria-hidden="true" inert>
    <header class="song-top">
      <button id="songBack" class="ghost back" type="button">&larr; Back</button>
      <h1>Songs</h1>
    </header>
    <div class="song-body">
      <section class="card">
        <div class="song-pick">
          <select id="songSelect" aria-label="Choose song"></select>
          <button id="songNew" type="button">+ New</button>
        </div>
        <input id="songName" class="text-input" type="text" maxlength="40" autocomplete="off" aria-label="Song name" placeholder="Song name">
        <div class="song-manage">
          <button id="songDup" type="button">Duplicate song</button>
          <button id="songDel" type="button" class="danger">Delete song</button>
        </div>
      </section>

      <section class="card">
        <h2>Timeline</h2>
        <div class="timeline" id="timeline"></div>
        <p class="hint" id="songTotal"></p>
      </section>

      <section class="card now" id="nowPlaying" hidden aria-live="polite">
        <div class="now-head">
          <span class="swatch"></span>
          <span class="now-title" id="nowTitle"></span>
          <span class="now-meter" id="nowMeter"></span>
        </div>
        <div class="now-bar" id="nowBar"></div>
        <div class="now-sub"><span id="nowSongBar"></span><span id="nowNext"></span></div>
        <div class="beats" id="nowBeats"></div>
      </section>

      <div class="section-list" id="sectionList"></div>
      <button id="addSection" class="wide add-section" type="button">+ Add section</button>

      <section class="card">
        <h2>Options</h2>
        <div class="field"><span class="field-label">Count-in</span><div class="chips" id="countInChips"></div></div>
        <div class="field"><span class="field-label">At the end</span><div class="chips" id="endChips"></div></div>
        <p class="hint" id="endHint"></p>
      </section>
    </div>
  </div>

  <footer class="playbar">
    <button id="play" class="play" type="button" aria-pressed="false">
      <span class="play-icon" aria-hidden="true"></span><span id="playLabel">Start</span>
    </button>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
